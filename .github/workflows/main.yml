name: Release

on:
  repository_dispatch:
    types: [build-release]
  workflow_dispatch:

jobs:
  publish-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Miguelfigrs/Equinox_System
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.client_payload.ref || 'master' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: Equinox.UI
        run: pnpm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        with:
          projectPath: Equinox.UI
          tagName: v__VERSION__
          releaseName: Equinox System v__VERSION__
          releaseBody: |
            ## O que há de novo nesta versão
            Veja os assets abaixo para baixar e instalar.
          releaseDraft: true
          prerelease: false

  publish-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: publish-desktop

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Miguelfigrs/Equinox_System
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.client_payload.ref || 'master' }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: Equinox.UI
        run: pnpm install

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | tr -d ' \n\r' | base64 --decode > $RUNNER_TEMP/equinox-release.keystore

      - name: Build Android APK
        working-directory: Equinox.UI
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: pnpm tauri android build --apk

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks $RUNNER_TEMP/equinox-release.keystore \
            --ks-key-alias equinox \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out equinox-system-release.apk \
            Equinox.UI/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: Get release tag
        id: get_tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 5
            });
            const release = releases.data.find(r => r.draft) || releases.data[0];
            return release.tag_name;

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.result }}
          files: equinox-system-release.apk
          draft: true

  create-latest-json:
    runs-on: ubuntu-latest
    needs: [publish-desktop, publish-android]
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Generate and upload latest.json
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 5
            });

            const release = releases.data.find(r => r.draft) || releases.data[0];
            const tag = release.tag_name;
            const version = tag.replace(/^v/, '');

            const assetsResp = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100
            });
            const assets = assetsResp.data;

            console.log('=== TODOS OS ASSETS DA RELEASE ===');
            assets.forEach(a => console.log(a.name));
            console.log('==================================');

            const findAsset = (pattern) => {
              const a = assets.find(a => pattern.test(a.name));
              return a ? a.browser_download_url : null;
            };

            const latestJson = {
              version,
              notes: release.body || '',
              pub_date: release.published_at || new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  url: findAsset(/\.msi\.zip$/),
                  signature: ''
                },
                'linux-x86_64': {
                  url: findAsset(/\.AppImage\.tar\.gz$/),
                  signature: ''
                },
                'darwin-aarch64': {
                  url: findAsset(/aarch64\.app\.tar\.gz$/),
                  signature: ''
                },
                'darwin-x86_64': {
                  url: findAsset(/x86_64\.app\.tar\.gz$/),
                  signature: ''
                }
              }
            };

            for (const [platform, data] of Object.entries(latestJson.platforms)) {
              if (data.url) {
                const sigAsset = assets.find(a => a.name === assets.find(b => b.browser_download_url === data.url)?.name + '.sig');
                if (sigAsset) {
                  const sigResp = await fetch(sigAsset.browser_download_url);
                  latestJson.platforms[platform].signature = await sigResp.text();
                }
              }
            }

            const content = JSON.stringify(latestJson, null, 2);

            const existing = assets.find(a => a.name === 'latest.json');
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.id
              });
            }

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: 'latest.json',
              data: content,
              headers: { 'content-type': 'application/json' }
            });

            console.log('latest.json uploaded successfully');
