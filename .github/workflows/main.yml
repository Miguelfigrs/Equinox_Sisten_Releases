name: Release

'on':
  repository_dispatch:
    types: [build-release]
  workflow_dispatch:

jobs:
  publish-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Miguelfigrs/Equinox_System
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.client_payload.ref || 'master' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: Equinox.UI
        run: pnpm install

      - name: Setup signing key
        shell: bash
        run: |
          KEY_FILE="$RUNNER_TEMP/signing.key"
          echo "$TAURI_KEY_B64" | tr -d ' \t\n\r' | base64 -d > "$KEY_FILE"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_FILE" >> $GITHUB_ENV
        env:
          TAURI_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        with:
          projectPath: Equinox.UI
          tagName: v__VERSION__
          releaseName: Equinox System v__VERSION__
          releaseBody: |
            ## O que há de novo nesta versão
            Veja os assets abaixo para baixar e instalar.
          releaseDraft: true
          prerelease: false

      # CORREÇÃO: limpa a chave de assinatura após o build
      - name: Cleanup signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/signing.key"

  publish-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: publish-desktop

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Miguelfigrs/Equinox_System
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.client_payload.ref || 'master' }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # CORREÇÃO: targets na mesma linha (sem quebra de linha sem backslash)
      - name: Install Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: Equinox.UI
        run: pnpm install

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | tr -d ' \n\r' | base64 --decode > $RUNNER_TEMP/equinox-release.keystore

      - name: Build Android APK
        working-directory: Equinox.UI
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: pnpm tauri android build --apk

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks $RUNNER_TEMP/equinox-release.keystore \
            --ks-key-alias equinox \
            --ks-pass pass:${{ secrets.ANDROID_STORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out equinox-system-release.apk \
            Equinox.UI/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: Get release tag
        id: get_tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20
            });
            const release = releases.data
              .filter(r => r.draft)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

            // CORREÇÃO: lança erro em vez de usar tag hardcoded como fallback
            if (!release) throw new Error('Nenhum draft release encontrado para upload do APK');
            return release.tag_name;

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.result }}
          files: equinox-system-release.apk
          draft: true

      # CORREÇÃO: limpa o keystore após o build
      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/equinox-release.keystore"

  create-latest-json:
    runs-on: ubuntu-latest
    needs: [publish-desktop, publish-android]
    permissions:
      contents: write
    steps:
      - name: Generate and upload latest.json
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const allReleases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20
            });

            const release = allReleases.data
              .filter(r => r.draft)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

            if (!release) throw new Error('Nenhum draft release encontrado');

            console.log(`Release: ${release.tag_name} (id: ${release.id})`);

            const tag = release.tag_name;
            const version = tag.replace(/^v/, '');

            const assetsResp = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100
            });
            const assets = assetsResp.data;

            console.log('=== ASSETS ===');
            assets.forEach(a => console.log(a.name));

            const findAsset = (regex) => assets.find(a => regex.test(a.name));

            const findUrl = (regex) => {
              const a = findAsset(regex);
              return a ? a.browser_download_url : null;
            };

            // CORREÇÃO: usa a API autenticada do GitHub para baixar .sig
            // em vez de fetch() direto (que falha em draft releases)
            const getSig = async (regex) => {
              const a = findAsset(regex);
              if (!a) return '';
              const resp = await github.rest.repos.getReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: a.id,
                headers: { Accept: 'application/octet-stream' }
              });
              // O Octokit retorna o conteúdo em resp.data para assets de texto
              return typeof resp.data === 'string' ? resp.data.trim() : Buffer.from(resp.data).toString('utf8').trim();
            };

            const platforms = {};

            const winUrl     = findUrl(/x64-setup\.exe$/);
            const winSig     = await getSig(/x64-setup\.exe\.sig$/);
            if (winUrl && winSig) platforms['windows-x86_64'] = { url: winUrl, signature: winSig };

            const linuxUrl   = findUrl(/amd64\.AppImage$/);
            const linuxSig   = await getSig(/amd64\.AppImage\.sig$/);
            if (linuxUrl && linuxSig) platforms['linux-x86_64'] = { url: linuxUrl, signature: linuxSig };

            const macAarch64Url = findUrl(/aarch64\.app\.tar\.gz$/);
            const macAarch64Sig = await getSig(/aarch64\.app\.tar\.gz\.sig$/);
            if (macAarch64Url && macAarch64Sig) platforms['darwin-aarch64'] = { url: macAarch64Url, signature: macAarch64Sig };

            const macX64Url  = findUrl(/x64\.app\.tar\.gz$/);
            const macX64Sig  = await getSig(/x64\.app\.tar\.gz\.sig$/);
            if (macX64Url && macX64Sig) platforms['darwin-x86_64'] = { url: macX64Url, signature: macX64Sig };

            console.log('Platforms found:', Object.keys(platforms));

            // CORREÇÃO: valida que todas as plataformas desktop foram encontradas
            const expectedPlatforms = ['windows-x86_64', 'linux-x86_64', 'darwin-aarch64', 'darwin-x86_64'];
            const missingPlatforms = expectedPlatforms.filter(p => !platforms[p]);
            if (missingPlatforms.length > 0) {
              console.warn(`AVISO: Plataformas ausentes no latest.json: ${missingPlatforms.join(', ')}`);
              // Lança erro para evitar publicar um latest.json incompleto
              throw new Error(`Não foi possível gerar latest.json: faltam assets para ${missingPlatforms.join(', ')}`);
            }

            const content = JSON.stringify({
              version,
              notes: "Veja os assets abaixo para baixar e instalar.",
              pub_date: new Date().toISOString(),
              platforms
            }, null, 2);

            console.log('latest.json:\n', content);

            const existing = assets.find(a => a.name === 'latest.json');
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.id
              });
            }

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: 'latest.json',
              data: content,
              headers: { 'content-type': 'application/json' }
            });

            console.log('latest.json enviado com sucesso!');
